name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build isolated preview (demo only)
        run: npm run build
        env:
          VITE_DEMO_LOGIN_MODE: "true"
      - name: Upload isolated preview build
        uses: actions/upload-artifact@v4
        with:
          name: operator-preview-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1
